<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Préstamos UNCP{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color:#172033; }
    nav a { margin-right: 1rem; }
    table { width:100%; border-collapse:collapse; } th, td { border:1px solid #ccd3df; padding:.6rem; text-align:left; }
    .messages { list-style:none; padding:0; } .success { color:#087830; } .error { color:#b42318; } .warning { color:#9a6700; }
    input, select, textarea { width:100%; max-width:500px; padding:.55rem; margin:.25rem 0 .75rem; box-sizing:border-box; }
    button { background:#155eef; color:white; border:0; border-radius:5px; padding:.65rem 1rem; cursor:pointer; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'catalogo' %}">Catálogo</a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Panel</a>
      <form action="{% url 'logout' %}" method="post" style="display:inline">{% csrf_token %}
        <button type="submit" style="padding:.35rem .65rem">Cerrar sesión</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Iniciar sesión</a>
    {% endif %}
  </nav>
  {% if messages %}
    <ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
